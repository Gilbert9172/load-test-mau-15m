worker_processes auto;
events { worker_connections 8192; }
http {
  access_log off;
  upstream app {
    least_conn;
    server app1:8080 max_fails=3 fail_timeout=5s;
    server app2:8080 max_fails=3 fail_timeout=5s;
    server app3:8080 max_fails=3 fail_timeout=5s;
    keepalive 256;
  }
  server {
    listen 80;
    location / {
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_connect_timeout 1s;
      proxy_read_timeout 5s;
      proxy_next_upstream error timeout http_502 http_503;
    }
    # 가설 8·9: 개별 인스턴스 헬스 확인용
    location /stub_status { stub_status; }
  }
}
