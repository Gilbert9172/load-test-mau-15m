global:
  scrape_interval: 5s
scrape_configs:
  - job_name: app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app1:8080", "app2:8080", "app3:8080"]
  - job_name: mysql
    static_configs:
      - targets: ["mysql-exporter:9104"]
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
