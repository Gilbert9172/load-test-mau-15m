# 1단계: 한 대의 머신에 전부 띄운다.
# 실행: ./gradlew bootJar && docker compose up -d --build
x-app: &app
  build: .
  depends_on:
    mysql: { condition: service_healthy }
    redis: { condition: service_started }
  environment: &app-env
    DB_HOST: mysql
    REDIS_HOST: redis
    DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
    TOMCAT_MAX_THREADS: ${TOMCAT_MAX_THREADS:-200}
    CHART_TTL_SECONDS: ${CHART_TTL_SECONDS:-60}
    SERVER_SHUTDOWN: ${SERVER_SHUTDOWN:-immediate}
    JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx512m -XX:+UseG1GC}
  deploy:
    resources:
      limits: { cpus: "2", memory: 768M }

services:
  app1:
    <<: *app
    environment: { <<: *app-env, INSTANCE_NAME: app1 }
  app2:
    <<: *app
    environment: { <<: *app-env, INSTANCE_NAME: app2 }
  app3:
    <<: *app
    environment: { <<: *app-env, INSTANCE_NAME: app3 }

  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [app1, app2, app3]

  mysql:
    image: mysql:8.4
    ports: ["3306:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: loadtest
      MYSQL_USER: loadtest
      MYSQL_PASSWORD: loadtest
    command:
      - --innodb-buffer-pool-size=2G
      - --max-connections=500
      - --slow-query-log=1
      - --long-query-time=0.1
      - --slow-query-log-file=/var/lib/mysql/slow.log
    volumes:
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 초기화 스크립트(시드) 동안 MySQL은 임시 서버를 skip-networking 으로 띄운다.
      # 소켓 ping 은 그때도 통과하므로 TCP 로 물어봐야 앱이 일찍 붙다 죽지 않는다.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=tcp", "-uroot", "-proot"]
      interval: 5s
      retries: 20
      start_period: 180s   # 곡 100만 행 시드에 1~2분
    deploy:
      resources:
        limits: { cpus: "4", memory: 3G }

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]

  prometheus:
    image: prom/prometheus:v2.53.0
    ports: ["9090:9090"]
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.1.0
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro

  mysql-exporter:
    image: prom/mysqld-exporter:v0.15.1
    command: ["--mysqld.username=root:root", "--mysqld.address=mysql:3306"]
    depends_on: [mysql]

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    environment: { REDIS_ADDR: "redis://redis:6379" }
    depends_on: [redis]

volumes:
  mysql-data:
